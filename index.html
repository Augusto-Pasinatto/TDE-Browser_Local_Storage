<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contatos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <aside class="filtro">
        <header class="filtro__header">
          <h1>Filtragem</h1>
        </header>
      </aside>
      <section class="contatos">
        <header class="contatos__pesquisa">
          <input
            id="contatos__pesquisa-filtro"
            class="contatos__pesquisa-filtro"
            type="search"
            placeholder="Pesquisar"
          />
          <h1 class="contatos__pesquisa-title">Lista De Contatos</h1>
          <button class="contatos__pesquisa-botao">Adicionar Contato</button>
          <button class="contatos__pesquisa-botao margem__direita">
            Editar Contato
          </button>
        </header>
        <!-- <form class="" action="#"></form> -->
      </section>
    </main>
    <footer class="footer"></footer>
    <script type="module" src="script.js"></script>
  </body>
</html>
